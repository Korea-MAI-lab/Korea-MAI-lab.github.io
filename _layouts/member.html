---
layout: default
---
<article class="member-profile">
  <div class="member-hero">
    {% if page.photo %}
      <img class="member-photo" src="{{ page.photo | relative_url }}" alt="{{ page.name }}">
    {% else %}
      <div class="member-photo member-placeholder">{{ page.name | slice: 0 }}</div>
    {% endif %}
    <div>
      <h1>{{ page.name }}</h1>
      <p class="member-role">{{ page.role }}</p>
      {% if page.email %}<p><a href="mailto:{{ page.email }}">{{ page.email }}</a></p>{% endif %}
      {% if page.website %}<p><a href="{{ page.website }}">Personal website ↗</a></p>{% endif %}
    </div>
  </div>
  <div class="prose">{{ content }}</div>
</article>
